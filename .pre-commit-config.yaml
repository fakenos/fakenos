# Run all hooks with: uv run pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: ty check fakenos tasks.py update_platforms.py
        language: system
        pass_filenames: false
      - id: bandit
        name: Bandit
        entry: bandit -q -c pyproject.toml -r fakenos tasks.py update_platforms.py
        language: system
        pass_filenames: false
